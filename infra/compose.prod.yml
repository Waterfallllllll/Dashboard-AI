name: evergreen-dashboard

services:
  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
      - private

  web:
    image: evergreen-dashboard-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:4000
    expose:
      - "3000"
    networks:
      - private

  api:
    image: evergreen-dashboard-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY_HOPS: 1
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:4000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - private

  worker:
    image: evergreen-dashboard-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker-main.js"]
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - private

networks:
  public:
  private:
    internal: true
