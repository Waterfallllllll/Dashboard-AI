services:
  - type: web
    name: evergreen-dashboard-web
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: INTERNAL_API_URL
        fromService:
          type: pserv
          name: evergreen-dashboard-api
          property: hostport

  - type: pserv
    name: evergreen-dashboard-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    preDeployCommand: npm run db:migrate --workspace @dashboard/api
    envVars:
      - fromGroup: evergreen-dashboard-backend
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: evergreen-dashboard-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: evergreen-dashboard-db
          property: connectionString

  - type: worker
    name: evergreen-dashboard-worker
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/dist/worker-main.js
    preDeployCommand: npm run db:migrate --workspace @dashboard/api
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: evergreen-dashboard-backend
      - key: WORKER_ID
        value: render-worker
      - key: DATABASE_URL
        fromDatabase:
          name: evergreen-dashboard-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: evergreen-dashboard-db
          property: connectionString

databases:
  - name: evergreen-dashboard-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
    databaseName: evergreen_dashboard
    user: evergreen_dashboard
    ipAllowList: []

envVarGroups:
  - name: evergreen-dashboard-backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: LOG_LEVEL
        value: info
