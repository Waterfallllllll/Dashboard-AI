name: CI

on:
  push:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace @dashboard/api

      - name: Lint
        run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace @dashboard/api

      - name: Web unit tests
        run: npm run test:unit

      - name: API unit tests
        run: npx vitest run --project api unit.test.ts

      - name: Contract unit tests
        run: npx vitest run --project contracts

  component:
    name: Component tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Component tests
        run: npm run test:component

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dashboard:dashboard@localhost:5432/dashboard
      DIRECT_DATABASE_URL: postgresql://dashboard:dashboard@localhost:5432/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace @dashboard/api

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/compose.dev.yml up -d --wait postgres

      - name: Apply Prisma migrations
        run: npm run db:migrate --workspace @dashboard/api

      - name: Web integration tests
        run: npm run test:integration

      - name: API integration tests
        run: npx vitest run --project api integration.test.ts

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
